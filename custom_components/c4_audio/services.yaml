send_command:
  name: Send UDP command
  description: Send a raw Control4 serial-over-UDP body (c4.amp.*). Pick the amp when more than one is configured. A command with no reply is reported as a failure and does not change Home Assistant state.
  fields:
    command:
      required: true
      example: "c4.amp.out 01 03"
      selector:
        text:
    device_id:
      required: false
      name: Amp
      description: Required when more than one Control4 amp is configured.
      selector:
        device:
          multiple: false
          filter:
            - integration: c4_audio
    host:
      required: false
      description: Chassis IP, instead of the device.
      example: "192.168.68.93"
      selector:
        text:

set_route:
  name: Set route
  description: Route one zone to an input (0 disconnects). Uses c4.amp.out. Pick the amp when more than one is configured. Output and input must exist on that chassis.
  fields:
    output:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 8
    input:
      required: true
      example: 4
      selector:
        number:
          min: 0
          max: 8
    device_id:
      required: false
      name: Amp
      description: Required when more than one Control4 amp is configured.
      selector:
        device:
          multiple: false
          filter:
            - integration: c4_audio
    host:
      required: false
      description: Chassis IP, instead of the device.
      example: "192.168.68.93"
      selector:
        text:

turn_off_all:
  name: Turn off all zones
  description: Mute and disconnect every enabled amp zone. Pick amps, or leave empty for every amp.
  fields:
    device_id:
      required: false
      name: Amp
      description: Amps to change. Leave empty for every amp.
      selector:
        device:
          multiple: true
          filter:
            - integration: c4_audio
    host:
      required: false
      description: Chassis IP, instead of the device.
      example: "192.168.68.93"
      selector:
        text:

turn_on_all:
  name: Turn on all zones
  description: Turn on every enabled amp zone that is off (already-on rooms keep their volume). Pick amps, or leave empty for every amp.
  fields:
    device_id:
      required: false
      name: Amp
      description: Amps to change. Leave empty for every amp.
      selector:
        device:
          multiple: true
          filter:
            - integration: c4_audio
    host:
      required: false
      description: Chassis IP, instead of the device.
      example: "192.168.68.93"
      selector:
        text:
