# All On on the dashboard can call `c4_audio.turn_on_all` directly (no script).
# All Off needs a script so it can also stop the WiiM after the amp zones.
# Paste under `script:` in configuration.yaml, or create the off script in Helpers.

whole_home_music_off:
  alias: Whole-home music off
  icon: mdi:music-off
  mode: single
  sequence:
    - action: c4_audio.turn_off_all
    - action: media_player.turn_off
      target:
        entity_id:
          - media_player.wiim_pro
